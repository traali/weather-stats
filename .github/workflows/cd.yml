name: Cloudflare Pages CD

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  deployments: write

jobs:
  pages:
    name: Deploy Cloudflare Pages (production)
    runs-on: ubuntu-latest
    steps:
      - name: Token present?
        id: token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLOUDFLARE_API_TOKEN missing — skipping Pages deploy (Cellarer)"
          fi

      - name: Checkout Code
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: steps.token.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        if: steps.token.outputs.present == 'true'
        run: npm ci

      - name: Build Production Frontend
        if: steps.token.outputs.present == 'true'
        run: npm run build

      - name: Deploy Cloudflare Pages production alias
        if: steps.token.outputs.present == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${ secrets.CLOUDFLARE_API_TOKEN }
          accountId: ${ secrets.CLOUDFLARE_ACCOUNT_ID }
          command: pages deploy dist --project-name=weather-stats --commit-dirty=true
